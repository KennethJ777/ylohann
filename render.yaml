services:
  - type: web
    name: ylohann
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: INVITATION_CODE
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: ylohann-db
          property: connectionString
databases:
  - name: ylohann-db
