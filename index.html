function settingsDemo(){let u=user();views.innerHTML='<section class="settings-grid"><aside class="settings-menu"><b>PARAMÃˆTRES</b><a href="#sprofile">Modifier le profil</a><a href="#scontact">Email et tÃ©lÃ©phone</a><a href="#spass">Mot de passe</a><a>ConfidentialitÃ©</a></aside><div class="settings-content"><div id="sprofile" class="settings-card"><h1>Modifier le profil</h1><form id="spform"><label>Nom dâ€™utilisateur<input id="sname" value="'+esc(u.username)+'" required></label><label>Biographie<textarea id="sbio">'+esc(u.bio)+'</textarea></label><button>Enregistrer</button></form></div><div id="scontact" class="settings-card"><h2>Email et tÃ©lÃ©phone</h2><form id="scform"><label>Email<input id="semail" type="email" value="'+esc(u.email)+'" required></label><label>NumÃ©ro associÃ©<input id="sphone" type="tel" value="'+esc(u.phone||'')+'" placeholder="+33..."></label><button>Mettre Ã  jour</button></form></div><div id="spass" class="settings-card"><h2>Changer le mot de passe</h2><form id="sppform"><label>Ancien mot de passe<input id="sold" type="password" required></label><label>Nouveau mot de passe<input id="snew" type="password" minlength="8" required></label><label>Confirmer<input id="sconfirm" type="password" minlength="8" required></label><button>Changer le mot de passe</button></form></div></div></section>';spform.onsubmit=e=>{e.preventDefault();let n=sname.value.trim();if(state.users.some(x=>x.id!==u.id&&x.username.toLowerCase()===n.toLowerCase()))return alert('Ce nom est dÃ©jÃ  utilisÃ©.');u.username=n;u.bio=sbio.value;save();app()};scform.onsubmit=e=>{e.preventDefault();u.email=semail.value.trim().toLowerCase();u.phone=sphone.value.trim();save();alert('CoordonnÃ©es mises Ã  jour.')};sppform.onsubmit=async e=>{e.preventDefault();if(await hash(sold.value)!==u.password)return alert('Ancien mot de passe incorrect.');if(snew.value.length<8||snew.value!==sconfirm.value)return alert('Le nouveau mot de passe est invalide.');u.password=await hash(snew.value);save
